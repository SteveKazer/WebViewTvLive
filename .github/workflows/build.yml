name: Build APK

on:
  push:
    branches: [ main, yangshipin-only ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename release APK (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "YangshipinTV-${GITHUB_REF_NAME}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 央视频TV ${{ github.ref_name }}
          body: |
            ## 央视频TV ${{ github.ref_name }}

            单源极简电视直播：只使用央视频官方网页 tv/home，一个标签页看遍央视与卫视。

            本次更新（相对 v2.4.9）：

            - 修复：冷启动后画面停在默认 CCTV1，与频道列表/上下换台记忆的台不对应（慢冷启动下注入脚本就绪晚，恢复指令被静默丢失）——改为脚本就绪后再触发恢复、等待窗口 18s→60s、切换后校验生效并自动重点（最多 4 次）

            安装：下载下方 APK 直接安装（默认基于系统 WebView，无需额外内核；已装旧版可直接覆盖升级）。
          files: app/build/outputs/apk/release/*.apk