name: Build APK

on:
  push:
    branches: [ main, yangshipin-only ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename release APK (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "YangshipinTV-${GITHUB_REF_NAME}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 央视频TV ${{ github.ref_name }}
          body: |
            ## 央视频TV ${{ github.ref_name }}

            单源极简电视直播：只使用央视频官方网页 tv/home，一个标签页看遍央视与卫视。

            - 沉浸式画面：打开即铺满整屏，不显示网页按钮与栏目
            - 频道：央视 21 个（CCTV1 到 CCTV17 及 5+/4K/8K 衍生频道）+ 24 个卫视（已剔除付费频道）
            - 侧边抽屉换台面板：全部 / 央视 / 卫视 / ★收藏
            - 长按收藏、数字键选台（央视 1-21，卫视 101-138）
            - 地区卫视优先、记忆上次频道与清晰度
            - 切换清晰度平滑无黑闪，从原位置继续播放；换台自动跟随清晰度
            - 切台自愈（无画面自动重试），切流期间静音、声画同步揭幕
            - 版权限制直出：受限节目直接显示页面版权提示，不再卡在"正在切换"
            - 版权态保持显示页面版权提示；版权节目下清晰度切换自动忽略
            - 卡顿提示：播放卡顿时底部提示可尝试更换清晰度
            - 无图模式：设置开关隐藏海报等大图加速加载，小图标不受影响
            - 双内核：默认系统 WebView，设置中可切换腾讯 X5（老设备兼容）；X5 内核管理页支持按机型下载安装或本地文件导入安装
            - X5 内核离线备份：仓库提供 32 位（045738）与 64 位（046007）内核安装包，镜像失效时可下载后本地导入
            - 设置面板：上下键方向反转、播放内核、无图模式、应用自动更新
            - 手机触摸与电视遥控双端适配

            安装：下载下方 APK 直接安装（默认基于系统 WebView，无需额外内核）。
          files: app/build/outputs/apk/release/*.apk