name: Build APK

on:
  push:
    branches: [ main, yangshipin-only ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename release APK (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "YangshipinTV-${GITHUB_REF_NAME}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: YangshipinTV-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 央视频TV ${{ github.ref_name }}
          body: |
            ## 央视频TV ${{ github.ref_name }}

            单源极简电视直播：只使用央视频官方网页 tv/home，一个标签页看遍央视与卫视。

            本次更新（相对 v2.4.6）：

            - 修复：电视遥控无法操作设置面板（上下键逐行导航，焦点不再被滚动容器吞掉）
            - 修复：X5 内核管理页遥控无法操作，打开即聚焦主按钮，可遥控完成内核下载安装
            - 修复：X5 内核本地导入安装（位数校验改按包内条目名匹配，原实现会把所有本地内核文件误判为位数不符）；仓库附带 32/64 位离线内核包，在线镜像失效时可本地导入
            - 修复：频道列表按左键返回当前分类（原误跳收藏）
            - 优化：设置开关配色重绘（深色底盘+反色圆点，任何底色上都清晰可辨）
            - 新增：硬件加速渲染，默认开启——GPU 渲染管线，系统内核与腾讯 X5 双内核通用，电视/平板/手机默认一致；个别设备画面异常时可在设置中关闭改走软件渲染兜底
            - 移除：无图模式（实测会影响视频加载，开关与隐藏逻辑全部删除）
            - 版本线说明：v2.4.7 / v2.4.8 已发布后撤回，两版修复全部并入本版，详见 docs/v2.4.7-v2.4.8-fixlog.md

            安装：下载下方 APK 直接安装（默认基于系统 WebView，无需额外内核；已装旧版可直接覆盖升级）。
          files: app/build/outputs/apk/release/*.apk